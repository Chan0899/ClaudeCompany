<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多Claude协同系统 Demo</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ===== 顶部标题栏 ===== -->
<header class="topbar">
    <div class="topbar-title">
        <span class="logo-icon">🏢</span>
        <h1>多Claude协同系统 Demo</h1>
        <span class="badge">v1.0</span>
    </div>
    <div class="topbar-actions">
        <span class="status-dot" id="sysStatus"></span>
        <span id="sysStatusText">系统运行中</span>
        <button class="btn-reset" onclick="resetSystem()" title="重置系统">↻ 重置</button>
    </div>
</header>

<!-- ===== 主布局: 左面板(AI终端) + 右面板(交互区) ===== -->
<div class="main-container">

    <!-- ========== 左面板: AI终端状态 ========== -->
    <aside class="panel-left" id="panelLeft">
        <div class="panel-header">
            <h2>🤖 AI终端状态</h2>
        </div>

        <!-- AI状态卡片区 -->
        <div class="ai-cards" id="aiCards">
            <!-- 由JS动态渲染 -->
        </div>

        <!-- 实时日志区 -->
        <div class="log-section">
            <div class="log-header">
                <h3>📋 实时日志</h3>
                <button class="btn-clear" onclick="clearLogs()">清空</button>
            </div>
            <div class="log-stream" id="logStream">
                <div class="log-entry system">
                    <span class="log-time">--:--:--</span>
                    <span class="log-msg">等待系统事件...</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- ========== 右面板: 人类交互区 ========== -->
    <main class="panel-right" id="panelRight">

        <!-- Tab导航 -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="chat">💬 对话</button>
            <button class="tab-btn" data-tab="tasks">📋 任务</button>
            <button class="tab-btn" data-tab="code">📁 代码</button>
            <button class="tab-btn" data-tab="monitor">📊 监控</button>
        </nav>

        <!-- Tab: 对话 -->
        <section class="tab-content active" id="tab-chat">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-msg manager">
                    <div class="msg-sender">🤖 管理AI</div>
                    <div class="msg-body">你好! 我是管理AI, 请提交你的开发需求, 我会拆解并分配给执行AI团队处理。</div>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput"
                       placeholder="输入开发需求, 例如: 创建一个登录页面..."
                       onkeydown="if(event.key==='Enter')sendChat()">
                <button class="btn-send" onclick="sendChat()">发送 →</button>
            </div>
            <div class="quick-actions">
                <span>快捷需求:</span>
                <button onclick="quickTask('创建一个用户登录页面')">登录页</button>
                <button onclick="quickTask('开发数据管理列表页面和API接口')">数据管理</button>
                <button onclick="quickTask('构建用户注册功能前后端')">用户注册</button>
            </div>
        </section>

        <!-- Tab: 任务 -->
        <section class="tab-content" id="tab-tasks">
            <div class="task-list" id="taskList">
                <div class="task-empty">暂无任务, 请在对话中提交需求</div>
            </div>
        </section>

        <!-- Tab: 代码 -->
        <section class="tab-content" id="tab-code">
            <div class="code-layout">
                <div class="file-tree" id="fileTree">
                    <div class="file-tree-empty">暂无文件</div>
                </div>
                <div class="code-viewer" id="codeViewer">
                    <div class="code-placeholder">
                        <span class="code-icon">📄</span>
                        <p>选择左侧文件查看代码</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tab: 监控 (运维仪表盘) -->
        <section class="tab-content" id="tab-monitor">
            <!-- 顶部: 系统概览指标卡 -->
            <div style="padding:12px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border);">
                <div class="metric-cards" id="overviewStats">
                    <div class="metric-card"><div class="metric-label">加载中...</div></div>
                </div>
            </div>
            <!-- 三栏监控面板 -->
            <div style="display:flex;flex:1;overflow:hidden;">
                <!-- 任务流水线 -->
                <div style="flex:1;overflow-y:auto;padding:12px;border-right:1px solid var(--border);">
                    <div class="monitor-panel-title">🔧 任务流水线 <span class="refresh-time" id="pipelineTime"></span></div>
                    <div id="taskPipelinePanel" style="font-size:11px;color:var(--text-muted);">加载中...</div>
                </div>
                <!-- 错误日志 -->
                <div style="flex:1;overflow-y:auto;padding:12px;border-right:1px solid var(--border);">
                    <div class="monitor-panel-title">⚠ 错误日志 <span class="refresh-time" id="errorsTime"></span></div>
                    <div id="errorsPanel" style="font-size:11px;color:var(--text-muted);">加载中...</div>
                </div>
                <!-- 工具统计 -->
                <div style="flex:1;overflow-y:auto;padding:12px;">
                    <div class="monitor-panel-title">🔧 工具统计 <span class="refresh-time" id="toolsTime"></span></div>
                    <div id="toolLogsPanel" style="font-size:11px;color:var(--text-muted);">加载中...</div>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="/static/js/app.js"></script>

<!-- ===== 角色详情弹窗 (点击AI卡片触发) ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-container">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">角色详情</div>
            <button class="modal-close" onclick="closeRoleModal()">✕</button>
        </div>
        <nav class="modal-tabs">
            <button class="modal-tab-btn active" data-mtab="config">⚙ 角色配置</button>
            <button class="modal-tab-btn" data-mtab="memories">🧠 角色记忆</button>
            <button class="modal-tab-btn" data-mtab="handbook">📖 人设手册</button>
        </nav>
        <div class="modal-body">
            <div class="modal-tab-content active" id="modal-tab-config"></div>
            <div class="modal-tab-content" id="modal-tab-memories"></div>
            <div class="modal-tab-content" id="modal-tab-handbook"></div>
        </div>
    </div>
</div>
</body>
</html>
